[project]
name = "house-price-prediction"
version = "1.0.0"
description = "RealEstate.AI House Price Prediction Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=3.3.0",
    "reportlab>=4.0.0",
    "pydantic>=2.0.0",
    "joblib>=1.3.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
